<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">Exact exploitability over CFR+ training</title><desc id="desc">Log-log convergence curves for Kuhn Poker, Leduc Holdem, and a thirteen-rank one-card river game.</desc><style>text{font-family:system-ui,sans-serif;fill:#24292f}.grid{stroke:#d0d7de;stroke-width:1}.axis{stroke:#57606a;stroke-width:1.5}.line{fill:none;stroke:#0969da;stroke-width:3}.p1{stroke-dasharray:10 5}.p2{stroke-dasharray:2 5}.dot{fill:#fff;stroke:#0969da;stroke-width:2}.legend{font-size:14px}.tick{font-size:12px}.label{font-size:15px;font-weight:600}.title{font-size:20px;font-weight:700}</style><text class="title" x="410.0" y="24" text-anchor="middle">Exact exploitability over CFR+ training</text><line class="grid" x1="90.0" y1="35" x2="90.0" y2="430"/><text class="tick" x="90.0" y="452" text-anchor="middle">10^2</text><line class="grid" x1="325.0" y1="35" x2="325.0" y2="430"/><text class="tick" x="325.0" y="452" text-anchor="middle">10^3</text><line class="grid" x1="560.0" y1="35" x2="560.0" y2="430"/><text class="tick" x="560.0" y="452" text-anchor="middle">10^4</text><line class="grid" x1="795.0" y1="35" x2="795.0" y2="430"/><text class="tick" x="795.0" y="452" text-anchor="middle">10^5</text><line class="grid" x1="90" y1="430.0" x2="795" y2="430.0"/><text class="tick" x="78" y="434.0" text-anchor="end">10^-4</text><line class="grid" x1="90" y1="351.0" x2="795" y2="351.0"/><text class="tick" x="78" y="355.0" text-anchor="end">10^-3</text><line class="grid" x1="90" y1="272.0" x2="795" y2="272.0"/><text class="tick" x="78" y="276.0" text-anchor="end">10^-2</text><line class="grid" x1="90" y1="193.0" x2="795" y2="193.0"/><text class="tick" x="78" y="197.0" text-anchor="end">10^-1</text><line class="grid" x1="90" y1="114.0" x2="795" y2="114.0"/><text class="tick" x="78" y="118.0" text-anchor="end">10^0</text><line class="grid" x1="90" y1="35.0" x2="795" y2="35.0"/><text class="tick" x="78" y="39.0" text-anchor="end">10^1</text><line class="axis" x1="90" y1="430" x2="795" y2="430"/><line class="axis" x1="90" y1="35" x2="90" y2="430"/><text class="label" x="442.5" y="482" text-anchor="middle">Iterations (log scale)</text><text class="label" transform="translate(22 232.5) rotate(-90)" text-anchor="middle">Exploitability, chips/hand (log scale)</text><path class="line" d="M90.0,181.0 L254.3,218.1 L325.0,219.2 L489.3,341.0 L630.7,360.8 L795.0,390.2"/><circle class="dot" cx="90.0" cy="181.0" r="3.5"/><circle class="dot" cx="254.3" cy="218.1" r="3.5"/><circle class="dot" cx="325.0" cy="219.2" r="3.5"/><circle class="dot" cx="489.3" cy="341.0" r="3.5"/><circle class="dot" cx="630.7" cy="360.8" r="3.5"/><circle class="dot" cx="795.0" cy="390.2" r="3.5"/><line x1="585" y1="52" x2="625" y2="52" stroke="#0969da" stroke-width="3"/><text class="legend" x="633" y="57">kuhn</text><path class="line p1" d="M90.0,158.6 L254.3,171.4 L325.0,289.5 L418.5,313.9 L489.3,330.2"/><circle class="dot" cx="90.0" cy="158.6" r="3.5"/><circle class="dot" cx="254.3" cy="171.4" r="3.5"/><circle class="dot" cx="325.0" cy="289.5" r="3.5"/><circle class="dot" cx="418.5" cy="313.9" r="3.5"/><circle class="dot" cx="489.3" cy="330.2" r="3.5"/><line x1="585" y1="75" x2="625" y2="75" stroke="#0969da" stroke-width="3" stroke-dasharray="10 5"/><text class="legend" x="633" y="80">leduc</text><path class="line p2" d="M90.0,80.7 L254.3,100.7 L325.0,93.0 L489.3,251.9 L560.0,271.3 L630.7,282.7"/><circle class="dot" cx="90.0" cy="80.7" r="3.5"/><circle class="dot" cx="254.3" cy="100.7" r="3.5"/><circle class="dot" cx="325.0" cy="93.0" r="3.5"/><circle class="dot" cx="489.3" cy="251.9" r="3.5"/><circle class="dot" cx="560.0" cy="271.3" r="3.5"/><circle class="dot" cx="630.7" cy="282.7" r="3.5"/><line x1="585" y1="98" x2="625" y2="98" stroke="#0969da" stroke-width="3" stroke-dasharray="2 5"/><text class="legend" x="633" y="103">one-card</text></svg>
