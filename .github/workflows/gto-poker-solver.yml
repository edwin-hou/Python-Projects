name: GTO poker solver tests

on:
  push:
    paths:
      - "gto-poker-solver/**"
      - ".github/workflows/gto-poker-solver.yml"
  pull_request:
    paths:
      - "gto-poker-solver/**"
      - ".github/workflows/gto-poker-solver.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: gto-poker-solver

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: gto-poker-solver/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
